[project]
name = "earth-echo-api"
version = "0.1.0"
description = "API de Earth Echo"
authors = [
    { name = "UrielPandolfi", email = "urielpandolfi@gmail.com" },
]
requires-python = ">=3.12"
dependencies = [
    "blosc2>=3,<5",
    "earthaccess>=0.19.0",
    "eccodes>=2.50.1",
    "ecmwf-opendata>=0.3.35",
    "fastapi>=0.162.5",
    "h5py>=3.16.0",
    "jsonschema>=4.23",
    "netcdf4>=1.7.5.1.post1",
    "numcodecs>=0.15,<0.17",
    "pydantic>=2.14",
    "pyproj>=3.8.0",
    "pyshp>=2.3,<4",
    "rasterio>=1.5.2",
    "shapely>=2.1,<3",
    "truststore>=0.10.5",
    "uvicorn>=0.54",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "httpx2>=2.16.0",
    "pytest>=8.3",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "earth_echo"

[tool.pytest.ini_options]
testpaths = ["tests"]
